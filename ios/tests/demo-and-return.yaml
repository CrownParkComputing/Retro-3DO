- tapOn: "Settings"
- tapOn: "How Spryte works"
- assertVisible: "Welcome to Spryte"
- tapOn: "Next"
- tapOn: "Play the demo now"
- assertVisible:
    id: emulator-screen
- tapOn: "Session menu"
- tapOn: "Back to the guide"
- assertVisible: "Start with the demo"
- tapOn: "Skip"
- assertVisible: "Play the demo"
