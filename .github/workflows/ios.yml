name: iOS

on:
  push:
    # ios-shelf as well as main. main is Android and desktop only (dba47c2,
    # "iOS is Clio, and this repository is Android and desktop") and has no
    # ios/ directory, so this workflow does not exist there -- which is also
    # why workflow_dispatch below is never offered in the web UI: GitHub only
    # lists it for workflows already on the default branch. Naming the branch
    # here is the only way a push can build the iOS app at all.
    branches: [main, ios-shelf]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      screenshots:
        description: Also photograph the app on simulators
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: retro3do-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unsigned, no secrets, runs on every push and in forks. A broken tree fails
  # here loudly even when the release job below is skipped.
  simulator:
    name: iOS simulator (unsigned)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Report toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          cmake --version
      - name: Build for the simulator
        run: TARGET=simulator ./ios/build-ios-macos.sh

  # Boots a simulator, installs the app and photographs it.
  #
  # A build that compiles proves nothing about whether the app draws: this is
  # the job that produces something a person can look at. simctl can boot,
  # install and launch and nothing else -- there is no way to tap a tile from
  # a script -- so the second shot is taken with -autoplay-demo, which the app
  # honours only when that argument is passed.
  screenshots:
    name: iOS simulator screenshots
    runs-on: macos-26
    timeout-minutes: 60
    # Manual only. macOS runners bill at ten times the Linux rate and this job
    # boots two simulators, so running it on every push was the expensive half
    # of the pipeline for something nobody reads most pushes. Ask for it when
    # the screens have actually changed:
    #   gh workflow run ios.yml --ref ios-shelf -f screenshots=true
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build for the simulator
        run: TARGET=simulator ./ios/build-ios-macos.sh

      - name: Photograph the app at App Store sizes
        run: |
          set -euo pipefail
          app=$(find ios/build -name 'Retro-3DO.app' -type d -print -quit)
          [ -n "$app" ] || { echo "::error::no .app was built"; exit 1; }
          mkdir -p shots

          # Finds a simulator by name pattern, preferring one that already
          # exists and creating one from a matching device type otherwise.
          find_device() {
            local pattern="$1" udid
            udid=$(xcrun simctl list devices available \
                   | awk -v p="$pattern" '$0 ~ p { print; exit }' \
                   | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' | head -1)
            if [ -z "$udid" ]; then
              local type
              type=$(xcrun simctl list devicetypes \
                     | awk -v p="$pattern" '$0 ~ p { print; exit }' \
                     | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[^)]*' | head -1)
              [ -n "$type" ] || return 1
              udid=$(xcrun simctl create "shots-$$" "$type")
            fi
            echo "$udid"
          }

          # $1 pattern  $2 file prefix  $3 required landscape size WxH
          #   $4 rotation in degrees clockwise
          #
          # The rotation differs per device and is not guessable: the app is
          # landscape-only, but simctl captures the device in its physical
          # orientation and iOS does not pick the same landscape on both. The
          # iPhone comes out needing 270 and the iPad 90 -- checked by eye on
          # the artifacts, because a sideways screenshot is still exactly the
          # right number of pixels and passes every automatic check there is.
          capture() {
            local udid; udid=$(find_device "$1") || {
              echo "::error::no simulator matching $1"; exit 1; }
            echo "== $2 on $udid"
            xcrun simctl boot "$udid" >/dev/null 2>&1 || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$app"

            local n
            for n in 1 2; do
              if [ "$n" = 1 ]; then
                xcrun simctl launch "$udid" com.crownparkcomputing.retro3DO
                sleep 9; local name="$2-1-shelf"
              else
                xcrun simctl launch "$udid" com.crownparkcomputing.retro3DO -autoplay-demo
                sleep 13; local name="$2-2-demo"
              fi
              xcrun simctl io "$udid" screenshot "shots/$name-raw.png"
              xcrun simctl terminate "$udid" com.crownparkcomputing.retro3DO || true

              sips -r "$4" "shots/$name-raw.png" --out "shots/$name.png" >/dev/null
              rm -f "shots/$name-raw.png"

              local got
              got=$(sips -g pixelWidth -g pixelHeight "shots/$name.png" \
                    | awk '/pixelWidth/{w=$2} /pixelHeight/{h=$2} END{print w"x"h}')
              echo "   $name $got"
              # The whole point of naming the device is the size it produces.
              # A silent fallback to the wrong device yields screenshots App
              # Store Connect rejects, long after this job is green.
              [ "$got" = "$3" ] || { echo "::error::$name is $got, need $3"; exit 1; }
            done
            xcrun simctl shutdown "$udid" || true
          }

          capture 'iPhone 1[6-9] Pro Max' iphone-6.9in 2868x1320 270
          capture 'iPad Pro 13-inch'      ipad-13in   2752x2064 90

          mkdir -p shots/crashes
          cp ~/Library/Logs/DiagnosticReports/*Retro* shots/crashes/ 2>/dev/null || true
          if [ -n "$(ls -A shots/crashes 2>/dev/null)" ]; then
            echo "::warning::the app left a crash report"
            head -40 shots/crashes/* || true
          fi
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retro3do-screenshots
          path: shots

  # Signed device build, archived and uploaded to App Store Connect.
  #
  # Gated on SIGNING_PASSPHRASE and simply does not run without it, so a fork
  # sees the simulator job and nothing else. The signing material lives in
  # ios/signing/*.enc, all four encrypted under that one passphrase.
  release:
    name: iOS signed archive
    runs-on: macos-26
    timeout-minutes: 90
    # ios-shelf as well as main, for the same reason the push trigger names it:
    # the iOS app does not exist on main, so gating the only job that can
    # produce a TestFlight build on main alone means no iOS build can ever be
    # made. Narrow on purpose -- two named branches, not a wildcard, because
    # every run of this job uploads a real build to App Store Connect.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ios-shelf'
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_PASSPHRASE != '' }}
      BUNDLE_ID: com.crownparkcomputing.retro3DO
      TEAM_ID: 88A3T9K9C5
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # App Store Connect refuses a build made against too old an SDK, and says
      # so only at upload, after everything else has reported success.
      - name: Require an SDK App Store Connect will accept
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK: $sdk"
          [ "${sdk%%.*}" -ge 26 ] || {
            echo "::error::built against iOS SDK $sdk; App Store Connect requires 26 or later"
            exit 1; }

      - name: Decrypt the signing material
        if: env.HAS_SIGNING == 'true'
        env:
          PASS: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/signing"; mkdir -p "$D"; chmod 700 "$D"
          dec() { openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
                    -in "ios/signing/$1" -out "$D/$2" -pass env:PASS; }
          dec dist.p12.enc                dist.p12
          dec profile.mobileprovision.enc profile.mobileprovision
          dec asc_key.p8.enc              asc_key.p8
          dec signing.env.enc             signing.env
          echo "D=$D" >> "$GITHUB_ENV"

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          . "$D/signing.env"
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$D/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # codesign: in the partition list is the whole point. Without it the
          # key imports, find-identity calls it valid, and every signing
          # attempt fails with errSecInternalComponent -- which reads like a
          # broken certificate and is nothing of the kind.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$D/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Choose a build number
        if: env.HAS_SIGNING == 'true'
        id: buildno
        run: echo "n=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build, archive and export
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          # The profile's own Name, not a literal that can drift out of step
          # with the blob beside it.
          profile_name=$(security cms -D -i "$D/profile.mobileprovision" \
            | plutil -extract Name raw -o - -)
          echo "signing against profile: $profile_name"
          TEAM_ID="$TEAM_ID" \
          PROFILE_NAME="$profile_name" \
          SIGN_IDENTITY="Apple Distribution" \
          BUILD_NUMBER="${{ steps.buildno.outputs.n }}" \
          ARCHIVE=1 ./ios/build-ios-macos.sh

      # A delivery can report success, be given a UUID, and then be discarded
      # in processing -- by email, hours later, with this job green. A missing
      # icon key does it, and so does a purpose string for an API the binary
      # merely LINKS. Derived from the binary rather than a remembered list.
      - name: Verify the bundle cannot be discarded in processing
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          app=ios/build/ios-arm64/Retro-3DO.xcarchive/Products/Applications/Retro-3DO.app
          plist="$app/Info.plist"
          [ -f "$plist" ] || { echo "::error::no app in the archive"; exit 1; }
          need() {
            /usr/bin/plutil -extract "$1" raw -o - "$plist" >/dev/null 2>&1 \
              || { echo "::error::$1 is missing from the built bundle"; exit 1; }
          }
          need CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName
          need ITSAppUsesNonExemptEncryption
          got=$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$plist")
          [ "$got" = "$BUNDLE_ID" ] || {
            echo "::error::bundle id is $got, expected $BUNDLE_ID"; exit 1; }
          bin="$app/Retro-3DO"
          check_api() {
            if nm -u "$bin" 2>/dev/null | grep -q "$1"; then
              need "$2"; echo "  $1 is linked -> $2 present"
            fi
          }
          check_api AVCaptureDevice   NSCameraUsageDescription
          check_api AVCaptureSession  NSCameraUsageDescription
          check_api AVAudioSession    NSMicrophoneUsageDescription
          check_api CMMotionManager   NSMotionUsageDescription
          check_api CLLocationManager NSLocationWhenInUseUsageDescription
          check_api PHPhotoLibrary    NSPhotoLibraryUsageDescription
          check_api CNContactStore    NSContactsUsageDescription
          check_api CBCentralManager  NSBluetoothAlwaysUsageDescription
          echo "bundle looks deliverable"

      - name: Upload to App Store Connect
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          . "$D/signing.env"
          ipa=$(find ios/build/ios-arm64/export -name '*.ipa' -print -quit)
          [ -n "$ipa" ] || { echo "::error::no ipa was exported"; exit 1; }
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$D/asc_key.p8" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retro3do-ios
          path: ios/build/ios-arm64/export/*.ipa
          if-no-files-found: ignore
